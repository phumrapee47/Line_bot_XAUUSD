services:
  # Frontend LIFF App (Node.js Static Server)
  - type: web
    name: xauusd-trading-bot-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install
    startCommand: cd frontend && npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

  # Backend Node.js API Service
  - type: web
    name: xauusd-trading-bot-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && pip install -r requirements.txt && node seeds/seedTradingPairs.js
    startCommand: cd backend && npm start
    autoDeploy: true
    envVars:
      # Database (Supabase PostgreSQL)
      - key: DATABASE_URL
        sync: false  # Set this to your Supabase connection string in Render dashboard
      
      # Server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        fromService:
          name: xauusd-trading-bot-frontend
          type: web
          property: renderURL
      
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: "true"
      
      # LINE
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: USE_BROADCAST
        value: "true"
      
      # Trading
      - key: TECHNICAL_WEIGHT
        value: "0.6"
      - key: NEWS_WEIGHT
        value: "0.4"
      - key: BUY_THRESHOLD
        value: "0.60"
      - key: SELL_THRESHOLD
        value: "0.40"
      - key: CHECK_INTERVAL_MINUTES
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # Python ML Model Scheduler (Background Worker)
  - type: background_worker
    name: xauusd-python-scheduler
    runtime: python
    plan: free
    buildCommand: pip install -r ml-models/requirements.txt
    startCommand: cd ml-models && python scheduler.py
    autoDeploy: true
    envVars:
      # Database (Supabase PostgreSQL)
      - key: DATABASE_URL
        sync: false  # Set this to your Supabase connection string in Render dashboard
      
      # API Keys
      - key: GEMINI_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: USE_BROADCAST
        value: "true"
      - key: TECHNICAL_WEIGHT
        value: "0.6"
      - key: NEWS_WEIGHT
        value: "0.4"
      - key: PYTHON_VERSION
        value: "3.12.0"
